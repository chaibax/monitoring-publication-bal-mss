# Vigie de l'outil lui-même.
#
# Le pire résultat possible serait qu'une panne de l'outil soit prise pour
# une panne de la chaîne MSSanté. Cette tâche échoue — et ouvre un ticket qui
# mentionne le propriétaire du dépôt (job `alerte`) — dès que plus aucun
# agrégat n'a été produit depuis 48 heures. L'échec seul ne prévient personne
# utilement : voir la décision 12. Elle couvre aussi bien une source injoignable qu'une
# désactivation des tâches planifiées après soixante jours d'inactivité.
#
# Deux règles, parce qu'il y a deux façons de s'arrêter. Produire n'est pas
# publier : du 2026-09-04 au 2026-09-07, les agrégats sont arrivés chaque jour
# dans Git — la première règle est restée verte quatre jours durant — pendant
# que le site servait toujours ceux du 3 septembre, le déploiement échouant en
# bout de chaîne. Ce que lit un visiteur est la seule mesure qui compte
# vraiment ; elle a donc sa propre règle.

name: Vigie de l'outil

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:

jobs:
  fraicheur:
    name: Âge des agrégats
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_PUBLIE: https://monitoring-publication-bal-mss.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier que l'outil produit encore
        id: age
        run: |
          python - <<'PY'
          import glob, os, sys
          from datetime import date, datetime
          jours = sorted(os.path.basename(f)[:-5] for f in glob.glob("data/daily/*.json"))
          if not jours:
              sys.exit("AUCUN agrégat dans data/daily — l'outil n'a jamais produit.")
          age = (date.today() - date.fromisoformat(jours[-1])).days
          print(f"Dernier agrégat : {jours[-1]} ({age} j)")
          if age > 2:
              sys.exit(
                  f"ALERTE — aucun agrégat depuis {age} jours (dernier : {jours[-1]}). "
                  "Vérifier les tâches planifiées, qui se désactivent après soixante "
                  "jours d'inactivité sur un dépôt public, et la disponibilité de la source."
              )
          PY

      # Cette règle se lit du dehors, comme un visiteur : elle interroge le site
      # publié, pas le dépôt. Elle échoue là où la précédente reste verte —
      # quand la collecte tourne mais que la publication ne suit plus.
      - name: Vérifier que le site publie encore
        if: always()   # une collecte en panne ne doit pas masquer une publication en panne
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from datetime import date
          url = os.environ["SITE_PUBLIE"].rstrip("/") + "/data/index.json"
          try:
              with urllib.request.urlopen(url, timeout=30) as reponse:
                  jours = json.load(reponse)["jours"]
          except (urllib.error.URLError, ValueError, KeyError) as motif:
              sys.exit(f"ALERTE — le site publié est injoignable ou illisible ({url}) : {motif}")
          if not jours:
              sys.exit("ALERTE — le site ne sert aucun agrégat.")
          age = (date.today() - date.fromisoformat(jours[-1])).days
          print(f"Dernier agrégat servi par le site : {jours[-1]} ({age} j)")
          if age > 2:
              sys.exit(
                  f"ALERTE — le site sert des données vieilles de {age} jours "
                  f"(dernier : {jours[-1]}). Les agrégats peuvent être à jour dans Git "
                  "sans que la publication ait suivi : vérifier l'étape de déploiement "
                  "de la tâche Supervision."
              )
          PY

  # La mémoire de l'outil (empreintes salées du dernier relevé) vit dans le
  # cache GitHub, qui évince toute entrée non consultée pendant sept jours. Du
  # 10 au 16 octobre 2026, la collecte en panne ne l'a plus relue : elle a été
  # évincée, et les retraits de la semaine sont restés inconnus. La relire
  # chaque jour, dans une tâche indépendante de la collecte, la garde en vie
  # quelle que soit la durée d'une panne : le relevé suivant compare alors au
  # dernier relevé réussi et ne perd aucun mouvement. Voir la décision 11.
  memoire:
    name: Entretien de la mémoire de l'outil
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relire le dernier état de référence
        id: etat
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: etat-entretien-${{ github.run_id }}   # jamais créée : seule la clé de repli sert
          restore-keys: etat-

      - name: Vérifier qu'un état existe
        run: |
          if [ -z "${{ steps.etat.outputs.cache-matched-key }}" ] || [ ! -s .cache/etat.bin ]; then
            echo "::error::Aucun état de référence dans le cache : le prochain relevé sera indéterminé, et les mouvements depuis le dernier relevé réussi seront perdus."
            exit 1
          fi
          echo "État relu : ${{ steps.etat.outputs.cache-matched-key }} ($(du -h .cache/etat.bin | cut -f1))."

  # La vigie détectait déjà : c'est la remontée qui manquait (décision 12).
  alerte:
    name: Remontée humaine
    needs: [fraicheur, memoire]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TCHAP_HOMESERVER: ${{ vars.TCHAP_HOMESERVER }}
      TCHAP_ROOM_ID: ${{ vars.TCHAP_ROOM_ID }}
      TCHAP_ACCESS_TOKEN: ${{ secrets.TCHAP_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Ouvrir un ticket si la vigie a sonné
        if: needs.fraicheur.result == 'failure' || needs.memoire.result == 'failure'
        run: |
          bash .github/alerte.sh ouvrir panne-vigie \
            "Vigie : données périmées ou mémoire de l'outil absente" \
            "@${{ github.repository_owner }} — la vigie de l'outil a sonné (fraîcheur : ${{ needs.fraicheur.result }}, mémoire : ${{ needs.memoire.result }}).

          Soit plus aucun agrégat depuis 48 heures, soit le site ne les publie plus, soit l'état de référence a disparu du cache.

          Détail de l'exécution : $EXECUTION

          Ce ticket se fermera tout seul quand la vigie repassera au vert."

      - name: Fermer le ticket si la vigie est au vert
        if: needs.fraicheur.result == 'success' && needs.memoire.result == 'success'
        run: |
          bash .github/alerte.sh fermer panne-vigie "Vigie au vert : $EXECUTION"

      # Le canal Tchap peut tomber sans bruit : un compte Tchap expire faute de
      # renouvellement par courriel. Contrôlé chaque jour, sans rien poster ;
      # sa panne passe par un ticket, qui ne dépend pas de lui.
      - name: Vérifier le canal Tchap
        id: tchap
        continue-on-error: true
        run: python3 .github/tchap.py verifier

      - name: Ouvrir un ticket si le canal Tchap ne répond plus
        if: steps.tchap.outcome == 'failure'
        run: |
          bash .github/alerte.sh ouvrir panne-tchap \
            "Canal d'alerte Tchap hors service" \
            "@${{ github.repository_owner }} — le compte robot ne peut plus poster dans le salon Tchap d'alerte (jeton expiré, compte non renouvelé ou robot sorti du salon).

          Les alertes continuent d'arriver par ticket GitHub. Voir le journal de l'étape « Vérifier le canal Tchap » : $EXECUTION"

      - name: Fermer le ticket si le canal Tchap répond
        if: steps.tchap.outcome == 'success'
        run: |
          bash .github/alerte.sh fermer panne-tchap "Canal Tchap opérationnel : $EXECUTION"
