# TEMPORAIRE — exécution de diagnostic du refus « Forbidden » au déploiement.
#
# Cette version de la tâche ne vit que sur la branche de travail : elle ne
# collecte rien, ne commite rien, et ne publie rien en production. Elle
# interroge l'API Netlify avec le jeton du dépôt pour localiser précisément
# l'appel qui est refusé, puis tente un déploiement en brouillon.
#
# Le contenu original est restauré dès le diagnostic obtenu.

name: Supervision

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Lancer le traitement complet même sans changement de la source"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic du déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      # Chaque appel est un GET : rien n'est créé, rien n'est publié. Seuls le
      # libellé et le code HTTP sortent dans le journal, jamais un identifiant
      # de compte — les journaux d'un dépôt public sont lisibles par tous.
      - name: Localiser l'appel refusé
        run: |
          set -uo pipefail
          API=https://api.netlify.com/api/v1
          AUTH="Authorization: Bearer $NETLIFY_AUTH_TOKEN"

          sonder() {
            local libelle="$1" url="$2" code
            code=$(curl -sS -H "$AUTH" -o /tmp/corps.json -w '%{http_code}' "$url") || code=000
            printf '%-42s %s' "$libelle" "$code"
            if [ "$code" != "200" ]; then
              printf '  <- %s' "$(head -c 300 /tmp/corps.json | tr -d '\n' | sed -E 's/[A-Za-z0-9_-]{40,}/[MASQUE]/g')"
            fi
            printf '\n'
          }

          COMPTE=$(curl -sS -H "$AUTH" "$API/accounts" \
            | python3 -c 'import json,sys; c=json.load(sys.stdin); print(c[0]["id"] if c else "")')

          echo "== Lectures =="
          sonder "utilisateur"                  "$API/user"
          sonder "liste des projets"            "$API/sites?per_page=1"
          sonder "projet cible"                 "$API/sites/$NETLIFY_SITE_ID"
          sonder "deploiements du projet"       "$API/sites/$NETLIFY_SITE_ID/deploys?per_page=1"
          sonder "comptes"                      "$API/accounts"
          if [ -n "$COMPTE" ]; then
            sonder "variables d'env. du compte" "$API/accounts/$COMPTE/env?site_id=$NETLIFY_SITE_ID"
            sonder "membres du compte"          "$API/$COMPTE/members"
          else
            echo "aucun compte lisible par ce jeton"
          fi

      - name: Version du CLI
        run: npx --yes netlify-cli@26 --version

      # Sans --prod : le déploiement part en brouillon sur une URL éphémère,
      # le site en production n'est pas touché.
      - name: Déploiement en brouillon, sans construction
        continue-on-error: true
        run: |
          set -uo pipefail
          npx --yes netlify-cli@26 deploy \
            --site "$NETLIFY_SITE_ID" --dir web --no-build --debug 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{40,}/[MASQUE]/g'

      - name: Déploiement en brouillon, avec construction
        continue-on-error: true
        run: |
          set -uo pipefail
          npx --yes netlify-cli@26 deploy \
            --site "$NETLIFY_SITE_ID" --debug 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{40,}/[MASQUE]/g'
