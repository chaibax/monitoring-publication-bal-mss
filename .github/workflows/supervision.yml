# TEMPORAIRE — exécution de diagnostic du refus « Forbidden » au déploiement.
#
# Le premier passage a établi que le jeton lit tout (sept points d'API en 200)
# et qu'il crée des déploiements en brouillon sans difficulté, construction
# comprise. Seul « --prod » est refusé : le refus porte donc sur la mise en
# production, pas sur la création du déploiement.
#
# Ce second passage isole cette opération. Il publie un déploiement déjà
# construit lors du passage précédent, en appelant l'API directement pour voir
# le code HTTP et le corps de la réponse — ce que le CLI masque derrière son
# « JSONHTTPError: Forbidden ».
#
# Le contenu original est restauré dès le diagnostic obtenu.

name: Supervision

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Lancer le traitement complet même sans changement de la source"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic du déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      # Déploiement construit et téléversé lors du passage précédent, à partir
      # des agrégats à jour. Le publier suffit à remettre le site à niveau.
      BROUILLON: 6a9ebd699b707bf426fd4329
    steps:
      - uses: actions/checkout@v4

      - name: Publier un déploiement existant, réponse HTTP en clair
        run: |
          set -uo pipefail
          code=$(curl -sS -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H 'Content-Length: 0' \
            -o /tmp/corps.json -w '%{http_code}' \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$BROUILLON/restore") || code=000
          echo "== Mise en production d'un déploiement existant =="
          echo "code HTTP : $code"
          echo "réponse   : $(head -c 600 /tmp/corps.json | tr -d '\n' | sed -E 's/[A-Za-z0-9_-]{40,}/[MASQUE]/g')"

      - name: Cycle complet de déploiement en production
        continue-on-error: true
        run: |
          set -uo pipefail
          npx --yes netlify-cli@26 deploy \
            --site "$NETLIFY_SITE_ID" --prod --debug 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{40,}/[MASQUE]/g'

      - name: État publié après tentative
        if: always()
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
            | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          p = s.get("published_deploy") or {}
          print("déploiement publié :", p.get("id"))
          print("publié le          :", p.get("published_at"))
          print("verrouillé         :", p.get("locked"))
          print("constructions      :", "arrêtées" if (s.get("build_settings") or {}).get("stop_builds") else "actives")
          '
